{% extends "base.html" %}
{% block title %}Masuk — Rekonsiliasi{% endblock %}
{% block content %}
<div class="mx-auto max-w-sm">
  <h1 class="mb-4 font-serif text-xl">Masuk</h1>
  <form method="post" class="card space-y-3">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <label class="block text-sm">
      <span class="text-slate-500">Nama pengguna</span>
      {{ form.username }}
    </label>
    <label class="block text-sm">
      <span class="text-slate-500">Kata sandi</span>
      {{ form.password }}
    </label>
    <button class="btn-primary w-full justify-center">Masuk</button>
  </form>
</div>
{% endblock %}
